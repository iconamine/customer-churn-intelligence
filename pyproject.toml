[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-intelligence"
version = "0.1.0"
description = "Explainable customer churn scoring and retention prioritisation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "streamlit>=1.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
churn-train = "churn_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

